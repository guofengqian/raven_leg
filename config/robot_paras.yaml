      mass_g: 4.31
      qty: 1
    leg_holding_frames:      # 腿固定支架
      mass_g: 3.80
      qty: 2                 # 左右各 1
    leg_rest:                # 腿停靠/支撑件
      mass_g: 3.00
      qty: 1
    wing_connector:          # 机翼连接件
