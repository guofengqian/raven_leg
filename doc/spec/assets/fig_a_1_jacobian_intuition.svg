<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 616" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowA1" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlueA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrRoseA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#db2777"/>
    </marker>
    <marker id="arrGreenA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrOrangeA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrPurpleA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrSlateA1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 顶部总标题与核心物理定义 -->
  <text x="18" y="28" font-size="16.5" font-weight="800" fill="#0f172a">雅可比矩阵 J_tip 的几何物理意义</text>
  <text x="18" y="49" font-size="12" font-weight="700" fill="#0369a1">核心定义：第 j 列 = 只让第 j 个坐标以单位速率运动（q̇ⱼ = 1，其余 5 个锁死为 0）时，爪尖在世界系下的线速度矢量</text>

  <!-- ======================== 卡 ①（左上）：q₁ 沿 +X 水平平推 ======================== -->
  <g transform="translate(16, 66)">
    <rect width="466" height="258" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6" filter="url(#cardShadowA1)"/>
    <rect x="0" y="0" width="466" height="32" rx="12" fill="#fff7ed"/>
    <rect x="0" y="20" width="466" height="12" fill="#fff7ed"/>
    <line x1="0" y1="32" x2="466" y2="32" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="21" font-size="13.5" font-weight="800" fill="#9a3412">① 平动第 1 列（q₁）：沿 +X 水平平推</text>

    <!-- +X 坐标方向 -->
    <line x1="20" y1="54" x2="66" y2="54" stroke="#475569" stroke-width="1.8" marker-end="url(#arrSlateA1)"/>
    <text x="72" y="58" font-size="11" font-weight="800" fill="#475569">+X 方向</text>

    <!-- 起点虚线腿 -->
    <polyline points="108,94 82,136 96,184 138,184" fill="none" stroke="#94a3b8" stroke-width="2.6" stroke-dasharray="4,3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="108" cy="94" r="3.8" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    <circle cx="138" cy="184" r="4.5" fill="#ffffff" stroke="#64748b" stroke-width="2.2"/>
    <text x="138" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">p_tip 起点</text>

    <!-- 终点实线腿（右移 +130px） -->
    <polyline points="238,94 212,136 226,184 268,184" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="238" cy="94" r="3.8" fill="#334155"/>
    <circle cx="268" cy="184" r="4.5" fill="#ea580c"/>
    <text x="280" y="188" font-size="11" font-weight="700" fill="#ea580c">p_tip 终点</text>

    <!-- 橙色 +X 平推轨迹 -->
    <line x1="114" y1="94" x2="231" y2="94" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrOrangeA1)"/>
    <text x="173" y="84" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ea580c">沿 +X（q̇₁ = 1）</text>
    <line x1="145" y1="184" x2="260" y2="184" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrOrangeA1)"/>
    <text x="203" y="204" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ea580c">列1 = [1, 0]ᵀ</text>

    <rect x="16" y="220" width="434" height="26" rx="6" fill="#ffedd5"/>
    <text x="233" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a3412">第 1 列 = [1, 0]ᵀ（其余锁死，末端沿 +X 单位平移）</text>
  </g>

  <!-- ======================== 卡 ②（右上）：q₂ 沿 +Y 竖直平推 ======================== -->
  <g transform="translate(498, 66)">
    <rect width="466" height="258" rx="12" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.6" filter="url(#cardShadowA1)"/>
    <rect x="0" y="0" width="466" height="32" rx="12" fill="#fdf2f8"/>
    <rect x="0" y="20" width="466" height="12" fill="#fdf2f8"/>
    <line x1="0" y1="32" x2="466" y2="32" stroke="#fbcfe8" stroke-width="1"/>
    <text x="16" y="21" font-size="13.5" font-weight="800" fill="#9d174d">② 平动第 2 列（q₂）：沿 +Y 竖直平推</text>

    <!-- +Y 坐标方向 -->
    <line x1="40" y1="196" x2="40" y2="132" stroke="#475569" stroke-width="1.8" marker-end="url(#arrSlateA1)"/>
    <text x="20" y="120" font-size="11" font-weight="800" fill="#475569">+Y 方向</text>

    <!-- 起点虚线腿（下方，与终点腿零重叠） -->
    <polyline points="170,150 146,174 158,200 204,200" fill="none" stroke="#94a3b8" stroke-width="2.6" stroke-dasharray="4,3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="170" cy="150" r="3.8" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    <circle cx="204" cy="200" r="4.5" fill="#ffffff" stroke="#64748b" stroke-width="2.2"/>
    <text x="218" y="204" font-size="11" font-weight="700" fill="#64748b">p_tip 起点</text>

    <!-- 终点实线腿（上移 -74px，完全在上方） -->
    <polyline points="170,76 146,100 158,126 204,126" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="170" cy="76" r="3.8" fill="#334155"/>
    <circle cx="204" cy="126" r="4.5" fill="#db2777"/>
    <text x="218" y="130" font-size="11" font-weight="700" fill="#db2777">p_tip 终点</text>

    <!-- 玫红 +Y 平推轨迹 -->
    <line x1="170" y1="144" x2="170" y2="83" stroke="#db2777" stroke-width="2.2" marker-end="url(#arrRoseA1)"/>
    <text x="72" y="114" font-size="11.5" font-weight="700" fill="#db2777">沿 +Y</text>
    <text x="72" y="130" font-size="11" font-weight="700" fill="#db2777">（q̇₂ = 1）</text>
    <line x1="204" y1="193" x2="204" y2="134" stroke="#db2777" stroke-width="2.8" marker-end="url(#arrRoseA1)"/>
    <text x="220" y="168" font-size="12.5" font-weight="800" fill="#db2777">列2 = [0, 1]ᵀ</text>

    <rect x="16" y="220" width="434" height="26" rx="6" fill="#fce7f3"/>
    <text x="233" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9d174d">第 2 列 = [0, 1]ᵀ（其余锁死，末端沿 +Y 单位平移）</text>
  </g>

  <!-- ======================== 卡 ③（左下）：转动列 ======================== -->
  <g transform="translate(16, 342)">
    <rect width="466" height="258" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.6" filter="url(#cardShadowA1)"/>
    <rect x="0" y="0" width="466" height="32" rx="12" fill="#f0fdf4"/>
    <rect x="0" y="20" width="466" height="12" fill="#f0fdf4"/>
    <line x1="0" y1="32" x2="466" y2="32" stroke="#bbf7d0" stroke-width="1"/>
    <text x="16" y="21" font-size="13.5" font-weight="800" fill="#14532d">③ 转动第 3∼6 列（q₃∼q₆）：杆臂逆时针转 90°</text>

    <!-- 虚线圆弧（参考轨迹） -->
    <path d="M 207.4 200.9 A 113.14 113.14 0 0 0 278.0 102.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="196" y="212" font-size="10" fill="#94a3b8">圆弧轨迹</text>

    <!-- 转动后杆臂（浅灰虚线，逆时针转过 Δqⱼ 落在圆弧上） -->
    <line x1="165" y1="96" x2="273.2" y2="129.1" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="273.2" cy="129.1" r="3.6" fill="#94a3b8"/>
    <text x="236" y="102" text-anchor="middle" font-size="10" fill="#64748b">转动后杆臂</text>

    <!-- 两杆臂夹角 Δqⱼ -->
    <path d="M 197.5 128.5 A 46 46 0 0 0 209.0 109.4" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrOrangeA1)"/>
    <text x="216" y="126" font-size="10.5" font-weight="700" fill="#ea580c">Δqⱼ</text>

    <!-- 当前杆臂 r_j（蓝实线） -->
    <line x1="165" y1="96" x2="240" y2="171" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arrBlueA1)"/>
    <text x="148" y="156" font-size="12" font-weight="700" fill="#0284c7">杆臂 rⱼ</text>
    <text x="140" y="172" font-size="11" fill="#0369a1">[rₓ, rᵧ]ᵀ</text>

    <!-- 杆臂延伸虚线 + 逆转 90° 弧箭头 -->
    <line x1="245" y1="176" x2="266" y2="197" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="3,2"/>
    <path d="M 259.1 190.1 A 20 20 0 0 0 259.1 161.9" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreenA1)"/>
    <text x="272" y="182" font-size="10.5" font-weight="700" fill="#15803d">逆转 90°</text>

    <!-- 直角符号 90° -->
    <path d="M 236.5 167.5 L 245 159 L 253.5 167.5" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- 切向速度矢量（绿，杆臂逆时针转 90°） -->
    <line x1="249" y1="172" x2="314" y2="107" stroke="#16a34a" stroke-width="3.2" marker-end="url(#arrGreenA1)"/>
    <text x="304" y="132" font-size="12" font-weight="800" fill="#15803d">第 j 列 = R(90°) rⱼ</text>
    <text x="304" y="148" font-size="11.5" font-weight="700" fill="#16a34a">= [−rᵧ, rₓ]ᵀ</text>

    <!-- 转动中心 + 逆时针弧箭头 -->
    <path d="M 145 90 A 21 21 0 0 0 163 117" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrOrangeA1)"/>
    <text x="92" y="110" font-size="11.5" font-weight="700" fill="#ea580c">q̇ⱼ = 1</text>
    <circle cx="165" cy="96" r="5.5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
    <text x="178" y="84" font-size="11.5" font-weight="700" fill="#ea580c">铰点 p_c(j)</text>

    <!-- 当前爪尖点 p_tip -->
    <circle cx="245" cy="176" r="4.8" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/>
    <text x="236" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">p_tip</text>

    <rect x="16" y="220" width="434" height="26" rx="6" fill="#dcfce7"/>
    <text x="233" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">第 j 列 = R(90°) rⱼ = [−rᵧ, rₓ]ᵀ（其余锁死，杆臂逆转 90°）</text>
  </g>

  <!-- ======================== 卡 ④（右下）：加权叠加 ======================== -->
  <g transform="translate(498, 342)">
    <rect width="466" height="258" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6" filter="url(#cardShadowA1)"/>
    <rect x="0" y="0" width="466" height="32" rx="12" fill="#f5f3ff"/>
    <rect x="0" y="20" width="466" height="12" fill="#f5f3ff"/>
    <line x1="0" y1="32" x2="466" y2="32" stroke="#ddd6fe" stroke-width="1"/>
    <text x="16" y="21" font-size="13.5" font-weight="800" fill="#4c1d95">④ 矩阵乘法：各列速度矢量加权叠加</text>

    <!-- 起点 p_tip -->
    <circle cx="74" cy="192" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
    <text x="48" y="210" font-size="11" font-weight="700" fill="#16a34a">p_tip</text>

    <!-- 分量矢量首尾相接 -->
    <line x1="74" y1="192" x2="196" y2="192" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOrangeA1)"/>
    <text x="136" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ea580c">q̇₁ × 列1</text>

    <line x1="202" y1="192" x2="202" y2="160" stroke="#db2777" stroke-width="2.5" marker-end="url(#arrRoseA1)"/>
    <text x="212" y="180" font-size="11.5" font-weight="700" fill="#db2777">q̇₂ × 列2</text>

    <line x1="202" y1="154" x2="314" y2="138" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreenA1)"/>
    <text x="268" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16a34a">q̇₃ × 列3</text>

    <line x1="320" y1="136" x2="310" y2="66" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreenA1)"/>
    <text x="326" y="106" font-size="11.5" font-weight="700" fill="#16a34a">q̇₄ × 列4 + …</text>

    <!-- 合成总速度（紫粗箭头） -->
    <line x1="74" y1="192" x2="304" y2="64" stroke="#7c3aed" stroke-width="3.6" marker-end="url(#arrPurpleA1)"/>
    <text x="68" y="88" font-size="13" font-weight="800" fill="#6d28d9">总速度 ṗ_tip</text>
    <text x="68" y="106" font-size="12" font-weight="700" fill="#7c3aed">= J_tip × q̇</text>

    <rect x="16" y="220" width="434" height="26" rx="6" fill="#ede9fe"/>
    <text x="233" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">ṗ_tip = J_tip × q̇（平动与各轴转动产生的末端线速度矢量叠加）</text>
  </g>
</svg>
