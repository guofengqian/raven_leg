<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 226" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowAT6" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlueAT6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrOrangeAT6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrSlateAT6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <rect width="636" height="210" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6" filter="url(#cardShadowAT6)"/>

    <!-- 顶部一句话标题条 -->
    <rect x="0" y="0" width="636" height="32" rx="12" fill="#fff7ed"/>
    <rect x="0" y="20" width="636" height="12" fill="#fff7ed"/>
    <line x1="0" y1="32" x2="636" y2="32" stroke="#fed7aa" stroke-width="1"/>
    <text x="318" y="21" text-anchor="middle" font-size="12" font-weight="800" fill="#9a3412">图 A.2 · 当 q̇₁ = 1 m/s（其余为 0）时，末端沿 +X 平动，线速度 v_tip = [1, 0]ᵀ m/s</text>

    <!-- 内容区整体下移 20px -->
    <g transform="translate(0, 20)">
      <!-- 左上角基向量 e_x 指示 -->
      <line x1="26" y1="28" x2="68" y2="28" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateAT6)"/>
      <text x="75" y="32" font-size="11.5" font-weight="800" fill="#475569">基向量 eₓ (+X)</text>

      <!-- 世界原点 O 与小型世界系坐标轴 -->
      <line x1="52" y1="164" x2="82" y2="164" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateAT6)"/>
      <line x1="52" y1="164" x2="52" y2="136" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateAT6)"/>
      <circle cx="52" cy="164" r="3.8" fill="#475569"/>
      <text x="26" y="180" font-size="11" font-weight="700" fill="#475569">O (世界原点)</text>

      <!-- 实箭头：O → O_B（髋铰点 / Body frame 原点） -->
      <line x1="56" y1="161" x2="218" y2="61" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateAT6)"/>
      <text x="122" y="102" font-size="12" font-weight="700" fill="#475569">p_OB</text>

      <!-- 实箭头：O → p_tip -->
      <line x1="56" y1="163" x2="258" y2="151" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateAT6)"/>
      <text x="158" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">p_tip</text>

      <!-- 当前构型整腿（单一瞬时构型，深灰实线） -->
      <rect x="200" y="48" width="52" height="16" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
      <polyline points="226,56 194,100 212,132 268,150" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="194" cy="100" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <circle cx="212" cy="132" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>

      <!-- 虚箭头：杆臂向量 r₁ = p_tip − p_OB（刚性锁定，无相对转动） -->
      <line x1="229" y1="62" x2="264" y2="143" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrBlueAT6)"/>
      <text x="256" y="102" font-size="11.5" font-weight="700" fill="#0284c7">杆臂 r₁ = p_tip − p_OB</text>
      <text x="256" y="117" font-size="10.5" fill="#0369a1">（关节锁死，刚性随动）</text>

      <!-- 节点 O_B 与 p_tip -->
      <circle cx="226" cy="56" r="4.8" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
      <text x="194" y="60" text-anchor="end" font-size="11.5" font-weight="700" fill="#ea580c">O_B / J₁</text>
      <circle cx="268" cy="150" r="4.8" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
      <text x="268" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ea580c">p_tip</text>

      <!-- 机身瞬时速度矢量（橙色，长 140px） -->
      <line x1="234" y1="56" x2="374" y2="56" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrOrangeAT6)"/>
      <text x="304" y="45" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ea580c">q̇₁ = 1 m/s（其余为 0）</text>

      <!-- 爪尖瞬时线速度矢量（橙色，与机身速度严格等长同向 140px） -->
      <line x1="276" y1="150" x2="416" y2="150" stroke="#ea580c" stroke-width="3.4" marker-end="url(#arrOrangeAT6)"/>
      <text x="424" y="146" font-size="12.5" font-weight="800" fill="#ea580c">末端线速度 v_tip (列 1)</text>
      <text x="424" y="164" font-size="12.2" font-weight="800" fill="#c2410c">= eₓ = [1, 0]ᵀ m/s</text>
      <text x="424" y="179" font-size="10.5" font-weight="600" fill="#64748b">（方向与大小和 O_B 完全一致）</text>
    </g>
  </g>
</svg>
