<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 248" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowA0B" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrGreenA0B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <rect width="636" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadowA0B)"/>

    <!-- 顶部标题条 -->
    <rect x="0" y="0" width="636" height="30" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="18" width="636" height="12" fill="#f1f5f9"/>
    <line x1="0" y1="30" x2="636" y2="30" stroke="#e2e8f0" stroke-width="1"/>
    <text x="318" y="20" text-anchor="middle" font-size="12.2" font-weight="800" fill="#1e293b">图 A.4 · 转置矩阵与第 5 个广义力的标量加权展开</text>

    <g transform="translate(0, 26)">
    <!-- ======================== 上半区：Q_c = J_tipᵀ · f_c ======================== -->
    <rect x="18" y="12" width="600" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- 左侧公式：Q_c = J_tipᵀ f_c = -->
    <text x="34" y="69" font-size="14.5" font-weight="800" fill="#0f172a">Q_c</text>
    <text x="70" y="69" font-size="14.5" font-weight="700" fill="#334155">=</text>
    <text x="88" y="69" font-size="14" font-weight="800" fill="#16a34a">J_tipᵀ</text>
    <text x="134" y="69" font-size="14" font-weight="800" fill="#7c3aed">f_c</text>
    <text x="158" y="69" font-size="14.5" font-weight="700" fill="#334155">=</text>

    <!-- 转置矩阵 J_tipᵀ 左右括号 -->
    <path d="M 186 20 L 179 20 L 179 108 L 186 108" fill="none" stroke="#334155" stroke-width="1.8"/>
    <path d="M 374 20 L 381 20 L 381 108 L 374 108" fill="none" stroke="#334155" stroke-width="1.8"/>

    <!-- 第 1 行高亮（橙色，对应图 A.1 第 1 列转置） -->
    <rect x="188" y="22" width="184" height="18" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
    <text x="234" y="35" text-anchor="middle" font-size="12" font-weight="800" fill="#ea580c">1</text>
    <text x="326" y="35" text-anchor="middle" font-size="12" font-weight="800" fill="#ea580c">0</text>

    <!-- 第 2 行（浅灰） -->
    <text x="234" y="51" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">0</text>
    <text x="326" y="51" text-anchor="middle" font-size="11.5" font-weight="700" fill="#64748b">1</text>

    <!-- 省略号 -->
    <text x="280" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">⋮</text>

    <!-- 第 5 行高亮（绿色，对应图 A.1 第 5 列转置） -->
    <rect x="188" y="69" width="184" height="21" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <text x="234" y="83" text-anchor="middle" font-size="11.2" font-weight="800" fill="#16a34a">∂x_tip / ∂q₅</text>
    <text x="326" y="83" text-anchor="middle" font-size="11.2" font-weight="800" fill="#16a34a">∂y_tip / ∂q₅</text>

    <!-- 第 6 行（浅灰） -->
    <text x="234" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">∂x_tip / ∂q₆</text>
    <text x="326" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">∂y_tip / ∂q₆</text>

    <!-- 紫色接触力列向量 [fₓ, fᵧ]ᵀ -->
    <path d="M 402 42 L 396 42 L 396 88 L 402 88" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="403" y="45" width="36" height="40" rx="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
    <text x="421" y="61" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">fₓ</text>
    <text x="421" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">fᵧ</text>
    <path d="M 440 42 L 446 42 L 446 88 L 440 88" fill="none" stroke="#7c3aed" stroke-width="1.8"/>

    <!-- 右侧行含义标注 -->
    <rect x="462" y="25" width="142" height="22" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="533" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">第 1 行 · f_c → Q_c,1 = fₓ</text>

    <rect x="462" y="69" width="142" height="22" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="533" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">第 5 行 · f_c → Q_c,5</text>

    <!-- ======================== 绿色向下引出箭头 ======================== -->
    <line x1="280" y1="116" x2="280" y2="135" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreenA0B)"/>
    <text x="290" y="130" font-size="10.5" font-weight="700" fill="#15803d">展开第 5 行（c₅ᵀ · f_c）</text>

    <!-- ======================== 下半区：Q_c,5 标量加权展开 ======================== -->
    <rect x="18" y="139" width="600" height="53" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>

    <text x="318" y="160" text-anchor="middle" font-size="11.8" font-weight="800">
      <tspan fill="#14532d">Q_c,5 = </tspan><tspan fill="#16a34a">−(l₂ sin α₂ + l₃ sin α₃ + l₄ sin α₄)</tspan><tspan fill="#7c3aed">·fₓ</tspan><tspan fill="#14532d"> + </tspan><tspan fill="#16a34a">(l₂ cos α₂ + l₃ cos α₃ + l₄ cos α₄)</tspan><tspan fill="#7c3aed">·fᵧ</tspan>
    </text>

    <text x="318" y="181" text-anchor="middle" font-size="11.8" font-weight="800">
      <tspan fill="#14532d">= </tspan><tspan fill="#0284c7">(−r₅,ᵧ)</tspan><tspan fill="#7c3aed">·fₓ</tspan><tspan fill="#14532d"> + </tspan><tspan fill="#0284c7">(+r₅,ₓ)</tspan><tspan fill="#7c3aed">·fᵧ</tspan><tspan fill="#475569" font-size="10.8" font-weight="600">   （元素 c₅,ₓ, c₅,ᵧ 即 fₓ, fᵧ 的标量权重）</tspan>
    </text>
    </g>
  </g>
</svg>
