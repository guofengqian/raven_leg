<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" rx="14" fill="#fff"/><text x="28" y="38" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">踝扭簧线性近似（示例本构，论文未给出曲线）</text><path d="M120 270V85M120 180H390" fill="none" stroke="#64748b" stroke-width="2"/><path d="M135 130L375 230" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M135 125Q255 290 375 125" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="10 7"/><path d="M255 88V270" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><text x="86" y="95" font-family="sans-serif" font-size="16">τₐ</text><text x="365" y="205" font-family="sans-serif" font-size="16">q₅</text><text x="220" y="294" font-family="sans-serif" font-size="15">q₅,₀</text><text x="150" y="115" font-family="sans-serif" font-size="15" fill="#2563eb">恢复力矩 τₐ = −kₐ(q₅−q₅,₀)</text><text x="480" y="125" font-family="sans-serif" font-size="18" fill="#334155">Vₐ = ½kₐ(q₅−q₅,₀)²</text><text x="480" y="170" font-family="sans-serif" font-size="17" fill="#334155">屈曲偏转：弹簧储能</text><text x="480" y="208" font-family="sans-serif" font-size="17" fill="#334155">伸展回弹：释放储能</text><text x="480" y="270" font-family="sans-serif" font-size="15" fill="#64748b">参考角两侧均为线性模型外推，</text><text x="480" y="294" font-family="sans-serif" font-size="15" fill="#64748b">不代表论文报告了双向实验曲线。</text></svg>
