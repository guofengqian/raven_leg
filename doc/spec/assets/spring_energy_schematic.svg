<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><rect width="900" height="320" rx="14" fill="#fbfdff"/><text x="30" y="40" font-family="sans-serif" font-size="23" font-weight="700" fill="#1e293b">论文所述两处扭簧及其能量作用</text>
<g transform="translate(200 165)"><path d="M-115 0H-28M28 0H118" stroke="#475569" stroke-width="16" stroke-linecap="round"/><circle r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle r="8" fill="#0f172a"/><path d="M0 -32A32 32 0 0 1 30 10M30 10A32 32 0 0 1 -20 25M-20 25A32 32 0 0 1 -25 -20M-25 -20A32 32 0 0 1 0 -32" fill="none" stroke="#2563eb" stroke-width="4"/><text x="-58" y="75" font-family="sans-serif" font-size="16" fill="#1d4ed8">踝：屈曲储能</text><text x="-67" y="101" font-family="sans-serif" font-size="15" fill="#334155">伸展释能</text></g>
<g transform="translate(455 165)"><path d="M-115 0H-28M28 0H118" stroke="#475569" stroke-width="16" stroke-linecap="round"/><circle r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><circle r="8" fill="#0f172a"/><path d="M0 -32A32 32 0 0 1 30 10M30 10A32 32 0 0 1 -20 25M-20 25A32 32 0 0 1 -25 -20M-25 -20A32 32 0 0 1 0 -32" fill="none" stroke="#16a34a" stroke-width="4"/><text x="-58" y="75" font-family="sans-serif" font-size="16" fill="#15803d">趾：偏转</text><text x="-67" y="101" font-family="sans-serif" font-size="15" fill="#334155">卸载后复位</text></g>
<path d="M565 165H625" stroke="#7c3aed" stroke-width="4"/><path d="M615 155L630 165L615 175" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="650" y="122" font-family="sans-serif" font-size="18" fill="#6d28d9">τₛq̇ = −V̇ₛ</text><text x="650" y="160" font-family="sans-serif" font-size="15" fill="#334155">扭簧做功与</text><text x="650" y="184" font-family="sans-serif" font-size="15" fill="#334155">弹性势能变化</text><text x="650" y="208" font-family="sans-serif" font-size="15" fill="#334155">符号相反</text><text x="175" y="290" font-family="sans-serif" font-size="16" fill="#64748b">扭簧力矩—角度关系采用本项目的线性近似；论文未报告具体参数或特性曲线。</text></svg>
