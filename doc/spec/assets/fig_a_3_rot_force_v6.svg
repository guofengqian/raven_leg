<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 278" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowAF4" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlueAF4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGreenAF4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrPurpleAF4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrSlateAF4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrOrangeAF4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <!-- 外框卡片（绿框，与图 A.3 转动列一致） -->
    <rect width="636" height="262" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.6" filter="url(#cardShadowAF4)"/>

    <!-- 顶部一句话总标题条 -->
    <rect x="0" y="0" width="636" height="32" rx="12" fill="#f0fdf4"/>
    <rect x="0" y="20" width="636" height="12" fill="#f0fdf4"/>
    <line x1="0" y1="32" x2="636" y2="32" stroke="#bbf7d0" stroke-width="1"/>
    <text x="318" y="21" text-anchor="middle" font-size="11.2" font-weight="800" fill="#14532d">图 A.6 · 当末端受接触力 f_c（其他关节固定）时，广义力的第 5 个分量（踝力矩）为 Q_c,5 = ‖r₅‖·f_⊥ = (−r₅,y)fₓ+(+r₅,x)fᵧ</text>

    <!-- 双栏主体下移 28px -->
    <g transform="translate(0, 28)">
      <!-- 中间虚线分隔 -->
      <line x1="318" y1="12" x2="318" y2="220" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="4,3"/>

      <!-- ====================================================================== -->
      <!-- 左栏：① 切向力产生力矩：滤除径向力，保留切向力                            -->
      <!-- ====================================================================== -->
      <text x="159" y="25" text-anchor="middle" font-size="12.2" font-weight="800" fill="#14532d">① 切向力产生力矩：滤除径向力，保留切向力</text>

      <!-- 上段锁死大腿 + 机身示意 -->
      <rect x="102" y="38" width="36" height="11" rx="5.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
      <line x1="120" y1="44" x2="106" y2="76" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round"/>

      <!-- 下游连杆骨架（J₂(106,76) → J₃(116,140) → p_tip(166,166)） -->
      <polyline points="106,76 116,140 166,166" fill="none" stroke="#94a3b8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="116" cy="140" r="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

      <!-- 蓝色杆臂 r₅：J₂(106,76) → p_tip(166,166) -->
      <line x1="106" y1="76" x2="162" y2="160" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arrBlueAF4)"/>
      <text x="128" y="132" font-size="11.5" font-weight="800" fill="#0284c7">r₅</text>

      <!-- 切线方向虚线（过 p_tip(166,166)，沿 (0.832, -0.555)） -->
      <line x1="141" y1="183" x2="262" y2="102" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="266" y="103" font-size="11" font-weight="800" fill="#16a34a">t̂₅</text>

      <!-- 矩形正交分解辅助虚线 -->
      <line x1="211" y1="81" x2="140.6" y2="127.9" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="3,2"/>
      <line x1="211" y1="81" x2="236.4" y2="119.1" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="3,2"/>

      <!-- 爪尖处 90° 直角符号 -->
      <path d="M 161.6 159.3 L 168.2 154.9 L 172.7 161.6" fill="none" stroke="#64748b" stroke-width="1.4"/>

      <!-- 径向无效分力 f_∥ -->
      <line x1="166" y1="166" x2="143.5" y2="132.2" stroke="#64748b" stroke-width="2.4" stroke-dasharray="4,2" marker-end="url(#arrSlateAF4)"/>
      <text x="150" y="99" text-anchor="middle" font-size="10.8" font-weight="700" fill="#475569">f_∥（力矩=0）</text>
      <line x1="150" y1="103" x2="146" y2="123" stroke="#94a3b8" stroke-width="1.1"/>

      <!-- 切向有效分力 f_⊥ -->
      <line x1="166" y1="166" x2="232" y2="122" stroke="#16a34a" stroke-width="3.2" marker-end="url(#arrGreenAF4)"/>
      <text x="239" y="131" font-size="11.8" font-weight="800" fill="#15803d">f_⊥ = f_c·t̂₅</text>
      <text x="239" y="144" font-size="10.2" font-weight="700" fill="#16a34a">有效切向力</text>

      <!-- 接触力 f_c -->
      <line x1="166" y1="166" x2="209" y2="85" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrPurpleAF4)"/>
      <text x="216" y="81" font-size="12.5" font-weight="800" fill="#7c3aed">f_c</text>

      <!-- 铰点 J₂ 与爪尖节点 -->
      <circle cx="106" cy="76" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
      <text x="96" y="79" text-anchor="end" font-size="11.5" font-weight="800" fill="#ea580c">J₂</text>
      <circle cx="166" cy="166" r="4.6" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/>
      <text x="166" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">p_tip</text>

      <!-- 左栏底部结论条 -->
      <rect x="14" y="196" width="290" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="159" y="213" text-anchor="middle" font-size="11.5" font-weight="800" fill="#14532d">关节力矩 Q_c,5 = ‖r₅‖ · f_⊥（切向力 × 杆臂）</text>

      <!-- ====================================================================== -->
      <!-- 右栏：② 水平 / 竖直力产生力矩：力 × 有向力臂                              -->
      <!-- ====================================================================== -->
      <text x="477" y="25" text-anchor="middle" font-size="12.2" font-weight="800" fill="#14532d">② 水平 / 竖直力产生力矩：力 × 有向力臂</text>

      <!-- 下游连杆骨架（与左栏完全同形） -->
      <polyline points="442,76 452,140 502,166" fill="none" stroke="#cbd5e1" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- fₓ 水平作用线 & fᵧ 竖直作用线 -->
      <line x1="432" y1="166" x2="564" y2="166" stroke="#d8b4fe" stroke-width="1.4" stroke-dasharray="4,3"/>
      <line x1="502" y1="64" x2="502" y2="176" stroke="#d8b4fe" stroke-width="1.4" stroke-dasharray="4,3"/>

      <!-- 平行四边形分解虚线 -->
      <line x1="547" y1="81" x2="547" y2="166" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="3,2"/>
      <line x1="547" y1="81" x2="502" y2="81" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="3,2"/>

      <!-- 蓝色杆臂 r₅ -->
      <line x1="442" y1="76" x2="498" y2="160" stroke="#0284c7" stroke-width="2.6" marker-end="url(#arrBlueAF4)"/>
      <text x="466" y="132" font-size="11.5" font-weight="800" fill="#0284c7">r₅</text>

      <!-- 绿竖直力臂 −r₅,y -->
      <line x1="442" y1="82" x2="442" y2="161" stroke="#16a34a" stroke-width="2.4" marker-start="url(#arrGreenAF4)" marker-end="url(#arrGreenAF4)"/>
      <path d="M 442 158 L 450 158 L 450 166" fill="none" stroke="#16a34a" stroke-width="1.4"/>
      <text x="434" y="118" text-anchor="end" font-size="12" font-weight="800" fill="#15803d">−r₅,y</text>
      <text x="434" y="132" text-anchor="end" font-size="10" font-weight="700" fill="#16a34a">fₓ 竖直力臂</text>

      <!-- 绿水平力臂 +r₅,x -->
      <line x1="448" y1="76" x2="497" y2="76" stroke="#16a34a" stroke-width="2.4" marker-start="url(#arrGreenAF4)" marker-end="url(#arrGreenAF4)"/>
      <path d="M 494 76 L 494 84 L 502 84" fill="none" stroke="#16a34a" stroke-width="1.4"/>
      <text x="474" y="64" text-anchor="middle" font-size="11.8" font-weight="800" fill="#15803d">+r₅,x（fᵧ 水平力臂）</text>

      <!-- 紫色合力 f_c 与分力 fₓ、fᵧ -->
      <line x1="502" y1="166" x2="545" y2="85" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrPurpleAF4)"/>
      <text x="553" y="81" font-size="12.5" font-weight="800" fill="#7c3aed">f_c</text>

      <line x1="502" y1="166" x2="543" y2="166" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrPurpleAF4)"/>
      <text x="551" y="170" font-size="12" font-weight="800" fill="#7c3aed">fₓ</text>

      <line x1="502" y1="166" x2="502" y2="86" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrPurpleAF4)"/>
      <text x="495" y="106" text-anchor="end" font-size="12" font-weight="800" fill="#7c3aed">fᵧ</text>

      <!-- J₂ 处逆时针正力矩指示弧 -->
      <path d="M 430 60 A 18 18 0 0 0 424 82" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrangeAF4)"/>
      <text x="420" y="60" text-anchor="end" font-size="10" font-weight="800" fill="#ea580c">CCW(+)</text>

      <!-- 铰点 J₂ 与爪尖节点 -->
      <circle cx="442" cy="76" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
      <text x="435" y="74" text-anchor="end" font-size="11.5" font-weight="800" fill="#ea580c">J₂</text>
      <circle cx="502" cy="166" r="4.6" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/>
      <text x="502" y="183" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">p_tip</text>

      <!-- 右栏底部结论条 -->
      <rect x="332" y="196" width="290" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="477" y="213" text-anchor="middle" font-size="11.5" font-weight="800" fill="#14532d">关节力矩 Q_c,5 = (−r₅,y)·fₓ + (+r₅,x)·fᵧ</text>
    </g>
  </g>
</svg>
