<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 242" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowAR5" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlueAR5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGreenAR5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrOrangeAR5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrSlateAR5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <rect width="636" height="226" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.6" filter="url(#cardShadowAR5)"/>

    <!-- 顶部一句话标题条 -->
    <rect x="0" y="0" width="636" height="32" rx="12" fill="#f0fdf4"/>
    <rect x="0" y="20" width="636" height="12" fill="#f0fdf4"/>
    <line x1="0" y1="32" x2="636" y2="32" stroke="#bbf7d0" stroke-width="1"/>
    <text x="318" y="21" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">图 A.3 · 当 q̇₅ = 1 rad/s（其余为 0）时，末端沿圆弧切线运动，线速度 v_tip = R(90°)r₅</text>

    <!-- 内容区整体下移 22px -->
    <g transform="translate(0, 22)">
      <!-- 世界原点 O 与小型世界系坐标轴 -->
      <line x1="52" y1="176" x2="82" y2="176" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateAR5)"/>
      <line x1="52" y1="176" x2="52" y2="148" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateAR5)"/>
      <circle cx="52" cy="176" r="3.8" fill="#475569"/>
      <text x="26" y="193" font-size="11" font-weight="700" fill="#475569">O (世界原点)</text>

      <!-- 实箭头：O → 踝铰点 p_c(5) -->
      <line x1="56" y1="173" x2="205" y2="84" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateAR5)"/>
      <text x="114" y="122" font-size="12" font-weight="700" fill="#475569">p_c(5)</text>

      <!-- 实箭头：O → 爪尖 p_tip -->
      <line x1="56" y1="175" x2="284" y2="161" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateAR5)"/>
      <text x="168" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">p_tip</text>

      <!-- 整腿上段（机身 Body + 锁死大腿 O_B/J₁ → J₂，保持不动） -->
      <rect x="220" y="20" width="52" height="16" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
      <line x1="246" y1="28" x2="212" y2="80" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="246" cy="28" r="4.2" fill="#64748b"/>
      <text x="278" y="32" font-size="11" font-weight="700" fill="#64748b">O_B / J₁（锁死）</text>

      <!-- 踝铰点下方当前构型杆子（单一瞬时构型，深灰实线） -->
      <polyline points="212,80 230,142 292,160" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="230" cy="142" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <text x="218" y="152" text-anchor="end" font-size="10.5" font-weight="700" fill="#475569">J₃</text>

      <!-- 淡灰虚线圆弧（瞬时运动趋势，以 J₂ 为圆心，半径 R = 113.14） -->
      <path d="M 272 175.6 A 113.14 113.14 0 0 0 325.1 80.0" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="4,3"/>
      <text x="316" y="72" font-size="10.5" fill="#94a3b8">瞬时圆弧轨迹</text>

      <!-- 当前有效杆臂 r₅ = p_tip − p_c(5)（蓝实线） -->
      <line x1="212" y1="80" x2="287" y2="155" stroke="#0284c7" stroke-width="3" marker-end="url(#arrBlueAR5)"/>
      <rect x="218" y="121" width="138" height="17" rx="4" fill="#ffffff" fill-opacity="0.92"/>
      <text x="287" y="133" text-anchor="middle" font-size="11.2" font-weight="800" fill="#0284c7">杆臂 r₅ = p_tip − p_c(5)</text>

      <!-- 杆臂延伸虚线 + 逆转 90° 弧箭头 -->
      <line x1="292" y1="160" x2="316" y2="184" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="3,2"/>
      <path d="M 308 176 A 22.6 22.6 0 0 0 308 144" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreenAR5)"/>
      <text x="322" y="165" font-size="11" font-weight="700" fill="#15803d">逆转 90°</text>

      <!-- 直角符号 90° -->
      <path d="M 284 152 L 292 144 L 300 152" fill="none" stroke="#475569" stroke-width="1.6"/>

      <!-- 瞬时切向线速度矢量（绿，杆臂逆转 90°，与 r₅ 严格等长） -->
      <line x1="296" y1="156" x2="372" y2="80" stroke="#16a34a" stroke-width="3.4" marker-end="url(#arrGreenAR5)"/>
      <text x="384" y="96" font-size="12.5" font-weight="800" fill="#15803d">末端切向速度 v_tip (列 5)</text>
      <text x="384" y="114" font-size="12.2" font-weight="800" fill="#16a34a">= R(90°) r₅ = [−r₅,ᵧ, r₅,ₓ]ᵀ</text>
      <text x="384" y="131" font-size="11" font-weight="700" fill="#15803d">（方向：圆弧切线，速率 = ‖r₅‖ m/s）</text>

      <!-- 踝铰点 J₂ 与逆时针角速度箭头 -->
      <path d="M 205 60 A 21 21 0 0 0 191 79" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrOrangeAR5)"/>
      <text x="122" y="70" font-size="11.5" font-weight="700" fill="#ea580c">q̇₅ = 1 rad/s</text>
      <circle cx="212" cy="80" r="5.8" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
      <text x="228" y="72" font-size="11.5" font-weight="700" fill="#ea580c">踝铰点 p_c(5)</text>

      <!-- 爪尖点 p_tip -->
      <circle cx="292" cy="160" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
      <text x="292" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16a34a">p_tip</text>
    </g>
  </g>
</svg>
