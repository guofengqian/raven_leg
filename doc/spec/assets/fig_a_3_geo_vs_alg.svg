<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 712" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowA3" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrBlueA3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrPurpleA3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrGreenA3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 顶部总标题（居中大号） -->
  <text x="290" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">以第 5 列 q₅（踝关节，影响下游 l₂∼l₄）为例</text>

  <!-- ======================== 上卡：路线 A 几何法 ======================== -->
  <g transform="translate(14, 50)">
    <rect width="552" height="236" rx="12" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.8" filter="url(#cardShadowA3)"/>
    <rect x="0" y="0" width="552" height="38" rx="12" fill="#f0f9ff"/>
    <rect x="0" y="24" width="552" height="14" fill="#f0f9ff"/>
    <line x1="0" y1="38" x2="552" y2="38" stroke="#bae6fd" stroke-width="1"/>
    <text x="16" y="26" font-size="16" font-weight="800" fill="#0c4a6e">路线 A · 几何法（杆臂逆转 90°）</text>

    <!-- 步骤 1 -->
    <rect x="14" y="50" width="524" height="58" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="26" y="72" font-size="14" font-weight="700" fill="#0369a1">① 写出绕 J₂ 的有效杆臂 r₅（i = 2, 3, 4）</text>
    <text x="26" y="98" font-size="16.5" font-weight="700" fill="#0284c7" font-family="ui-serif, Georgia, serif">r₅ = [ Σ lᵢ cos αᵢ ,   Σ lᵢ sin αᵢ ]ᵀ</text>

    <!-- 箭头 -->
    <line x1="120" y1="112" x2="120" y2="140" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrBlueA3)"/>
    <text x="140" y="132" font-size="14.5" font-weight="700" fill="#0284c7">左乘 R(90°)：(x, y) ↦ (−y, x)</text>

    <!-- 步骤 2 -->
    <rect x="14" y="148" width="524" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="26" y="169" font-size="14" font-weight="700" fill="#15803d">② 直接得到第 5 列切向速度权重</text>
    <text x="26" y="193" font-size="15.5" font-weight="700" fill="#14532d" font-family="ui-serif, Georgia, serif">J₁₅ = −(l₂ sin α₂ + l₃ sin α₃ + l₄ sin α₄)</text>
    <text x="26" y="215" font-size="15.5" font-weight="700" fill="#14532d" font-family="ui-serif, Georgia, serif">J₂₅ = +(l₂ cos α₂ + l₃ cos α₃ + l₄ cos α₄)</text>
  </g>

  <!-- 中间等价徽章 -->
  <circle cx="290" cy="306" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="290" y="313" text-anchor="middle" font-size="20" font-weight="800" fill="#15803d">=</text>

  <!-- ======================== 中卡：路线 B 代数法 ======================== -->
  <g transform="translate(14, 326)">
    <rect width="552" height="236" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.8" filter="url(#cardShadowA3)"/>
    <rect x="0" y="0" width="552" height="38" rx="12" fill="#f5f3ff"/>
    <rect x="0" y="24" width="552" height="14" fill="#f5f3ff"/>
    <line x1="0" y1="38" x2="552" y2="38" stroke="#ddd6fe" stroke-width="1"/>
    <text x="16" y="26" font-size="16" font-weight="800" fill="#4c1d95">路线 B · 代数法（正运动学求导归并）</text>

    <!-- 步骤 1 -->
    <rect x="14" y="50" width="524" height="58" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="26" y="72" font-size="14" font-weight="700" fill="#6d28d9">① 对 p_tip 求时间导（cos′ = −sin，sin′ = cos）</text>
    <text x="26" y="98" font-size="15.5" font-weight="700" fill="#4c1d95" font-family="ui-serif, Georgia, serif">ṗ_tip = [q̇₁, q̇₂]ᵀ + Σ [−lᵢ sin αᵢ, lᵢ cos αᵢ]ᵀ · α̇ᵢ</text>

    <!-- 箭头 -->
    <line x1="120" y1="112" x2="120" y2="140" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurpleA3)"/>
    <text x="140" y="132" font-size="14.5" font-weight="700" fill="#6d28d9">代入 α̇₂ = α̇₃ = … + q̇₅，α̇₄ = … + q̇₅ + q̇₆</text>

    <!-- 步骤 2 -->
    <rect x="14" y="148" width="524" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="26" y="169" font-size="14" font-weight="700" fill="#15803d">② 提取所有含 q̇₅ 的项（恰好为 i = 2, 3, 4）</text>
    <text x="26" y="193" font-size="15.5" font-weight="700" fill="#14532d" font-family="ui-serif, Georgia, serif">J₁₅ = −(l₂ sin α₂ + l₃ sin α₃ + l₄ sin α₄)</text>
    <text x="26" y="215" font-size="15.5" font-weight="700" fill="#14532d" font-family="ui-serif, Georgia, serif">J₂₅ = +(l₂ cos α₂ + l₃ cos α₃ + l₄ cos α₄)</text>
  </g>

  <!-- 汇合箭头 -->
  <line x1="290" y1="562" x2="290" y2="582" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreenA3)"/>

  <!-- ======================== 底卡：口算规律与本质统一 ======================== -->
  <rect x="14" y="588" width="552" height="110" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.6"/>
  <text x="290" y="615" text-anchor="middle" font-size="15.5" font-weight="800" fill="#14532d">口算规律：qⱼ 带动哪几段下游杆，第 j 列就由哪几段逆转 90° 组成</text>
  <text x="290" y="641" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">q₃, q₄ → l₁∼l₄   ·   q₅ → l₂∼l₄   ·   q₆ → 仅 l₄</text>
  <text x="290" y="665" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">趾关节 J_toe 停在 J₄（不含 l₄），故第 6 列恒为 0</text>
  <text x="290" y="688" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803d">本质统一：(cos αᵢ)′ = −sin αᵢ、(sin αᵢ)′ = cos αᵢ，几何上即逆转 90°</text>
</svg>
