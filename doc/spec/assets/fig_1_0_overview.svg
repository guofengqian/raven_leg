<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadow10" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrSlate10" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 顶部一句话主旨 -->
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">不涉及质量与力：搭好 6-DOF 几何骨架 → 写出踩地约束 → 建立接触力映射</text>

  <!-- ======================== 卡 ①：定姿态 ======================== -->
  <g transform="translate(12, 42)">
    <rect width="202" height="170" rx="12" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.8" filter="url(#cardShadow10)"/>
    <rect x="0" y="0" width="202" height="36" rx="12" fill="#f0f9ff"/>
    <rect x="0" y="22" width="202" height="14" fill="#f0f9ff"/>
    <line x1="0" y1="36" x2="202" y2="36" stroke="#bae6fd" stroke-width="1"/>
    <text x="101" y="24" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0c4a6e">① 定姿态 · 坐标 q</text>

    <rect x="12" y="48" width="178" height="72" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="101" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="#0284c7" font-family="ui-serif, Georgia, serif">q ∈ ℝ⁶</text>
    <text x="101" y="103" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0369a1">浮基位姿 3 + 腿关节 3</text>

    <rect x="12" y="132" width="178" height="26" rx="6" fill="#e0f2fe"/>
    <text x="101" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">确立全书几何状态底座</text>
  </g>

  <!-- 箭头 1→2 -->
  <line x1="218" y1="127" x2="233" y2="127" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrSlate10)"/>

  <!-- ======================== 卡 ②：推约束 ======================== -->
  <g transform="translate(239, 42)">
    <rect width="202" height="170" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8" filter="url(#cardShadow10)"/>
    <rect x="0" y="0" width="202" height="36" rx="12" fill="#f0fdf4"/>
    <rect x="0" y="22" width="202" height="14" fill="#f0fdf4"/>
    <line x1="0" y1="36" x2="202" y2="36" stroke="#bbf7d0" stroke-width="1"/>
    <text x="101" y="24" text-anchor="middle" font-size="14.5" font-weight="800" fill="#14532d">② 推约束 · J_c, J̇_c</text>

    <rect x="12" y="48" width="178" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="101" y="75" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d" font-family="ui-serif, Georgia, serif">J_c q̇ = 0</text>
    <text x="101" y="103" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d" font-family="ui-serif, Georgia, serif">J_c q̈ = −J̇_c q̇</text>

    <rect x="12" y="132" width="178" height="26" rx="6" fill="#dcfce7"/>
    <text x="101" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">脚踩地不打滑、不穿地</text>
  </g>

  <!-- 箭头 2→3 -->
  <line x1="445" y1="127" x2="460" y2="127" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrSlate10)"/>

  <!-- ======================== 卡 ③：留接口 ======================== -->
  <g transform="translate(466, 42)">
    <rect width="202" height="170" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.8" filter="url(#cardShadow10)"/>
    <rect x="0" y="0" width="202" height="36" rx="12" fill="#f5f3ff"/>
    <rect x="0" y="22" width="202" height="14" fill="#f5f3ff"/>
    <line x1="0" y1="36" x2="202" y2="36" stroke="#ddd6fe" stroke-width="1"/>
    <text x="101" y="24" text-anchor="middle" font-size="14.5" font-weight="800" fill="#4c1d95">③ 接触力映射</text>

    <rect x="12" y="48" width="178" height="72" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="101" y="77" text-anchor="middle" font-size="16" font-weight="800" fill="#6d28d9" font-family="ui-serif, Georgia, serif">Q_c = J_cᵀ f_c</text>
    <text x="101" y="103" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b21b6">接触力映为广义力</text>

    <rect x="12" y="132" width="178" height="26" rx="6" fill="#ede9fe"/>
    <text x="101" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">接入第 3 章动力学主方程</text>
  </g>
</svg>
