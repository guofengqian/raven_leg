<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 226" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowATF3" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrOrangeATF3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrPurpleATF3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrSlateATF3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <!-- 外框卡片（橙框，与图 A.2 平动列一致） -->
    <rect width="636" height="210" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6" filter="url(#cardShadowATF3)"/>

    <!-- 顶部一句话标题条 -->
    <rect x="0" y="0" width="636" height="32" rx="12" fill="#fff7ed"/>
    <rect x="0" y="20" width="636" height="12" fill="#fff7ed"/>
    <line x1="0" y1="32" x2="636" y2="32" stroke="#fed7aa" stroke-width="1"/>
    <text x="318" y="21" text-anchor="middle" font-size="11.2" font-weight="800" fill="#9a3412">图 A.5 · 当末端接触力 f_c 的 x 分量为 1 N 时，广义力的第一个分量（水平力）为 1 N</text>

    <!-- 内容区（单幅构图，与图 A.2 完全对称） -->
    <g transform="translate(0, 20)">
      <!-- 左上角基向量 e_x 指示 -->
      <line x1="26" y1="28" x2="68" y2="28" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlateATF3)"/>
      <text x="75" y="32" font-size="11.5" font-weight="800" fill="#475569">基向量 eₓ (+X)</text>

      <!-- 世界原点 O 与小型世界系坐标轴 -->
      <line x1="52" y1="164" x2="82" y2="164" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateATF3)"/>
      <line x1="52" y1="164" x2="52" y2="136" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arrSlateATF3)"/>
      <circle cx="52" cy="164" r="3.8" fill="#475569"/>
      <text x="26" y="180" font-size="11" font-weight="700" fill="#475569">O (世界原点)</text>

      <!-- 当前构型整腿（关节保持固定） -->
      <rect x="190" y="48" width="52" height="16" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.8"/>
      <polyline points="216,56 184,100 202,132 258,150" fill="none" stroke="#334155" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="184" cy="100" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <circle cx="202" cy="132" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
      <text x="172" y="105" text-anchor="end" font-size="10.5" font-weight="700" fill="#64748b">其余关节锁死</text>

      <!-- 机身水平广义力 Q_c,1 = 1 N（橙色，长 140px） -->
      <line x1="224" y1="56" x2="364" y2="56" stroke="#ea580c" stroke-width="3.2" marker-end="url(#arrOrangeATF3)"/>
      <text x="374" y="53" font-size="12.5" font-weight="800" fill="#ea580c">机身水平广义力 Q_c,1 = 1 N</text>
      <text x="374" y="69" font-size="11" font-weight="700" fill="#c2410c">（平动分力，非力矩 · 无力臂放大）</text>

      <!-- 爪尖单位水平接触力 f_c = [1, 0]ᵀ（紫色，长 140px） -->
      <line x1="266" y1="150" x2="406" y2="150" stroke="#7c3aed" stroke-width="3.2" marker-end="url(#arrPurpleATF3)"/>
      <text x="416" y="146" font-size="12.5" font-weight="800" fill="#7c3aed">单位水平接触力 f_c = [1, 0]ᵀ (1 N)</text>
      <text x="416" y="163" font-size="11" font-weight="700" fill="#64748b">（垂直方向不受力 fᵧ = 0）</text>
      <text x="416" y="179" font-size="11" font-weight="700" fill="#9a3412">c₁,ₓ = eₓ·[1, 0]ᵀ = 1</text>

      <!-- 节点 O_B 与 p_tip -->
      <circle cx="216" cy="56" r="4.8" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
      <text x="184" y="60" text-anchor="end" font-size="11.5" font-weight="700" fill="#ea580c">O_B / J₁</text>
      <circle cx="258" cy="150" r="4.8" fill="#ffffff" stroke="#7c3aed" stroke-width="2.4"/>
      <text x="258" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">p_tip</text>
    </g>
  </g>
</svg>
