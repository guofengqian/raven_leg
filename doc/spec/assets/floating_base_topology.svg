<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <pattern id="groundHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ======================== 左侧：矢状面浮基开链拓扑（对照论文 Extended Data Fig. 5a） ======================== -->
  <rect x="20" y="20" width="600" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 顶部极简图例 -->
  <g transform="translate(42, 42)">
    <circle cx="6" cy="0" r="4" fill="#0284c7"/>
    <text x="15" y="4" font-size="12" font-weight="600" fill="#0284c7">浮基 3-DOF (q₁, q₂, q₃)</text>
    <circle cx="170" cy="0" r="4" fill="#ea580c"/>
    <text x="179" y="4" font-size="12" font-weight="600" fill="#ea580c">关节 3-DOF (q₄, q₅, q₆)</text>
    <circle cx="335" cy="0" r="4" fill="#16a34a"/>
    <text x="344" y="4" font-size="12" font-weight="600" fill="#16a34a">外部接触约束</text>
  </g>

  <!-- 地面线与斜线阴影 -->
  <rect x="45" y="365.0" width="550" height="14" fill="url(#groundHatch)"/>
  <line x1="45" y1="365.0" x2="595" y2="365.0" stroke="#475569" stroke-width="2"/>

  <!-- 世界坐标系 O-XY (Base frame) -->
  <g transform="translate(80.0, 365.0)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#arrSlate)"/>
    <line x1="0" y1="0" x2="0" y2="-52" stroke="#0f172a" stroke-width="2" marker-end="url(#arrSlate)"/>
    <line x1="0" y1="0" x2="0" y2="54" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="3" fill="#0f172a"/>
    <text x="-16" y="13" font-size="12" font-weight="700" fill="#0f172a">O</text>
    <text x="54" y="4" font-size="12" font-weight="700" fill="#0f172a">+X</text>
    <text x="-8" y="-58" font-size="12" font-weight="700" fill="#0f172a">+Y</text>
  </g>

  <!-- 杆长按论文/YAML 比例绘制：l1:l2:l3:l4 = 0.12:0.12:0.023:0.06 m（θ₃=45°） -->
  <text x="42" y="62" font-size="11" fill="#64748b">杆长比例 l₁:l₂:l₃:l₄ = 120:120:23:60 mm</text>

  <!-- 浮基平动坐标标注 q1 (O -> O_B 水平投影), q2 (地面 -> O_B 竖直高度) -->
  <line x1="80.0" y1="409.0" x2="352.0" y2="409.0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="209.5" y="403.0" font-size="14" font-weight="700" fill="#0284c7">q₁</text>
  <line x1="355.0" y1="409.0" x2="355.0" y2="365.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="355.0" y1="365.0" x2="355.0" y2="178.0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="365.0" y="270.0" font-size="14" font-weight="700" fill="#0284c7">q₂</text>

  <!-- 机身（绕 O_B 逆时针抬头 q3 = 25°） -->
  <g transform="translate(355.0, 170.0)">
    <line x1="0" y1="0" x2="135" y2="0" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4"/>
    <g transform="rotate(-25.0)">
      <line x1="-175" y1="0" x2="155" y2="0" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4"/>
      <path d="M -145,-7 L 95,-11 C 115,-11 128,-5 128,0 C 128,5 115,11 95,11 L -145,7 C -155,7 -158,3 -158,0 C -158,-3 -155,-7 -145,-7 Z" fill="#334155" opacity="0.88"/>
      <path d="M -155,-4 L -180,-22 L -162,-22 L -138,-6 Z" fill="#64748b"/>
      <line x1="134" y1="-28" x2="134" y2="28" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="131" cy="0" r="3.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- 延长参考虚线（确定 q5, θ3, q6 零点基准） -->
  <line x1="231.61" y1="214.91" x2="194.04" y2="228.59" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="220.16" y1="345.72" x2="216.68" y2="385.54" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="236.34" y1="365.00" x2="265.26" y2="399.46" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- 四段串联连杆（按论文比例） -->
  <line x1="355.00" y1="170.00" x2="231.61" y2="214.91" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
  <text x="301.3" y="204.4" font-size="13" font-weight="700" fill="#1e293b">l₁</text>

  <line x1="231.61" y1="214.91" x2="220.16" y2="345.72" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <text x="237.9" y="280.3" font-size="13" font-weight="700" fill="#1e293b">l₂</text>

  <line x1="220.16" y1="345.72" x2="236.34" y2="365.00" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <text x="244.0" y="349.4" font-size="12" font-weight="700" fill="#475569">l₃</text>

  <line x1="236.34" y1="365.00" x2="302.00" y2="365.00" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <text x="262.0" y="355.0" font-size="13" font-weight="700" fill="#1e293b">l₄</text>

  <!-- 转角弧线 -->
  <path d="M 437.0,170.0 A 82,82 0 0,0 429.3,135.3" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="446.7" y="153.2" font-size="14" font-weight="700" fill="#0284c7">q₃</text>

  <path d="M 389.4,153.9 A 38,38 0 0,0 319.3,183.0" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="326.7" y="125.0" font-size="14" font-weight="700" fill="#ea580c">q₄</text>

  <path d="M 195.9,227.9 A 38,38 0 0,0 228.3,252.8" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="188.0" y="258.0" font-size="14" font-weight="700" fill="#ea580c">q₅</text>

  <path d="M 218.3,367.6 A 22,22 0 0,0 234.3,362.6" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlate)"/>
  <text x="200.0" y="372.0" font-size="12" font-weight="700" fill="#64748b">θ₃</text>

  <path d="M 258.2,391.0 A 34,34 0 0,0 270.3,365.0" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="276.0" y="396.0" font-size="14" font-weight="700" fill="#ea580c">q₆</text>

  <!-- 铰点与触地点 -->
  <circle cx="355.0" cy="170.0" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="367.0" y="192.0" font-size="12" font-weight="700" fill="#0f172a">O_B ≡ J₁</text>

  <circle cx="231.61" cy="214.91" r="5.5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="209.0" y="206.0" font-size="12" font-weight="700" fill="#0f172a">J₂</text>

  <rect x="216.16" y="341.72" width="8" height="8" rx="1.5" fill="#64748b"/>
  <text x="196.0" y="340.0" font-size="12" font-weight="700" fill="#475569">J₃</text>

  <circle cx="236.34" cy="365.00" r="5.5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="214.0" y="350.0" font-size="12" font-weight="700" fill="#16a34a">J₄ (p_toe)</text>

  <circle cx="302.00" cy="365.00" r="5.5" fill="#16a34a"/>
  <text x="312.0" y="361.0" font-size="12" font-weight="700" fill="#16a34a">p_tip</text>

  <line x1="236.34" y1="397.0" x2="236.34" y2="374.0" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrGreen)"/>
  <line x1="302.00" y1="397.0" x2="302.00" y2="374.0" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrGreen)"/>
  <text x="312.0" y="395.0" font-size="12" font-weight="700" fill="#16a34a">f_c</text>

  <!-- ======================== 右侧：三阶段模态演化 ======================== -->
  <rect x="640" y="20" width="260" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="660" y="46" font-size="13" font-weight="700" fill="#334155">模态切换（非固连地面）</text>

  <!-- Phase 1 小卡片 -->
  <g transform="translate(658, 62)">
    <rect x="0" y="0" width="224" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Phase 1</text>
    <text x="12" y="36" font-size="11" fill="#64748b">双点触地</text>
    <line x1="85" y1="80" x2="210" y2="80" stroke="#64748b" stroke-width="1.5"/>
    <line x1="100" y1="36" x2="174" y2="14" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <polyline points="146,22 114,34 112,68 124,80 166,80" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="124" cy="80" r="3.5" fill="#16a34a"/>
    <circle cx="166" cy="80" r="3.5" fill="#16a34a"/>
  </g>

  <line x1="770" y1="162" x2="770" y2="180" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlate)"/>

  <!-- Phase 2 小卡片 -->
  <g transform="translate(658, 186)">
    <rect x="0" y="0" width="224" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Phase 2</text>
    <text x="12" y="36" font-size="11" fill="#64748b">单点翻转</text>
    <line x1="85" y1="80" x2="210" y2="80" stroke="#64748b" stroke-width="1.5"/>
    <line x1="104" y1="30" x2="178" y2="10" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <polyline points="150,18 122,36 126,60 138,68 176,80" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="176" cy="80" r="3.5" fill="#16a34a"/>
  </g>

  <line x1="770" y1="286" x2="770" y2="304" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlate)"/>

  <!-- Phase 3 小卡片 -->
  <g transform="translate(658, 310)">
    <rect x="0" y="0" width="224" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#0f172a">Phase 3</text>
    <text x="12" y="36" font-size="11" fill="#64748b">离地腾空</text>
    <line x1="85" y1="84" x2="210" y2="84" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="108" y1="26" x2="182" y2="8" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <polyline points="154,15 128,32 134,54 146,60 182,62" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
