<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 476" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 顶部标题 -->
  <text x="24" y="34" font-size="19" font-weight="800" fill="#0f172a">仿生跳跃动力学建模、控制与设计闭环架构</text>
  <text x="24" y="54" font-size="12" fill="#64748b">五阶段模块分工与核心数据流向（配色与上方三式基石方程一一对应）</text>

  <!-- ======================== 阶段 1：浮基运动学（左上，绿） ======================== -->
  <g transform="translate(24, 72)">
    <rect width="316" height="176" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="316" height="34" rx="12" fill="#f0fdf4"/>
    <rect x="0" y="22" width="316" height="12" fill="#f0fdf4"/>
    <line x1="0" y1="34" x2="316" y2="34" stroke="#bbf7d0" stroke-width="1"/>
    <text x="16" y="22" font-size="13.5" font-weight="800" fill="#14532d">阶段 1 · 浮基运动学</text>

    <text x="16" y="54" font-size="12" fill="#475569">定义 6-DOF 广义坐标 q 与足地无滑移约束</text>

    <rect x="16" y="64" width="284" height="68" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="158" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284c7" font-family="ui-serif, Georgia, serif">q = [x_hip, y_hip, θ_b, q_hip, q_ankle, q_toe]ᵀ ∈ ℝ⁶</text>
    <text x="158" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" font-family="ui-serif, Georgia, serif">J_c q̇ = 0   ·   J_c q̈ = −J̇_c q̇</text>
    <text x="158" y="122" text-anchor="middle" font-size="11" fill="#166534">虚功接口：Q_c = J_cᵀ f_c</text>

    <rect x="16" y="142" width="284" height="24" rx="6" fill="#dcfce7"/>
    <text x="158" y="158" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">定义 q · 输出 p_c, J_c, J̇_c ➜ 物理引擎</text>
  </g>

  <!-- ======================== 阶段 2：执行机构与外力（左下，橙） ======================== -->
  <g transform="translate(24, 272)">
    <rect width="316" height="176" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="316" height="34" rx="12" fill="#fff7ed"/>
    <rect x="0" y="22" width="316" height="12" fill="#fff7ed"/>
    <line x1="0" y1="34" x2="316" y2="34" stroke="#fed7aa" stroke-width="1"/>
    <text x="16" y="22" font-size="13.5" font-weight="800" fill="#7c2d12">阶段 2 · 执行机构与非接触外力</text>

    <text x="16" y="58" font-size="12" fill="#475569">主方程右端力源：电机包络 + 扭簧 / 气动 / 推力</text>

    <rect x="16" y="72" width="284" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="158" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c" font-family="ui-serif, Georgia, serif">F_right = Sᵀ τ + f_ext</text>
    <text x="158" y="116" text-anchor="middle" font-size="11" fill="#9a3412">|τ_j| ≤ τ_max · max(0, 1 − |q̇_j|/ω_max)</text>

    <rect x="16" y="138" width="284" height="24" rx="6" fill="#ffedd5"/>
    <text x="158" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">输出 S, τ_max(q̇), f_ext ➜ 物理引擎</text>
  </g>

  <!-- ======================== 阶段 3：多体动力学与 KKT（中枢，紫） ======================== -->
  <g transform="translate(392, 72)">
    <rect width="336" height="376" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="336" height="36" rx="12" fill="#f5f3ff"/>
    <rect x="0" y="24" width="336" height="12" fill="#f5f3ff"/>
    <line x1="0" y1="36" x2="336" y2="36" stroke="#ddd6fe" stroke-width="1"/>
    <text x="16" y="23" font-size="14" font-weight="800" fill="#4c1d95">阶段 3 · 多体动力学与 KKT 引擎</text>

    <text x="16" y="60" font-size="12" fill="#475569">组装惯性/重力矩阵与模态 σ，正向同步求解</text>

    <!-- 主方程框 -->
    <rect x="16" y="74" width="304" height="58" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="168" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">受约束动力学主方程（式 10）</text>
    <text x="168" y="118" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4c1d95" font-family="ui-serif, Georgia, serif">M q̈ + C q̇ + g + J_cᵀ f_c = Sᵀ τ + f_ext</text>

    <!-- KKT 鞍点框 -->
    <rect x="16" y="146" width="304" height="120" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="168" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">触地相 KKT 鞍点方程</text>

    <!-- 左矩阵 [M J_c^T; J_c 0] -->
    <path d="M 38 180 L 28 180 L 28 242 L 38 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <path d="M 106 180 L 116 180 L 116 242 L 106 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <g font-family="ui-serif, Georgia, serif" font-size="13.5" font-weight="700" text-anchor="middle">
      <text x="52" y="204" fill="#4c1d95">M</text>
      <text x="90" y="204" fill="#16a34a">J_cᵀ</text>
      <text x="52" y="232" fill="#16a34a">J_c</text>
      <text x="90" y="232" fill="#94a3b8">0</text>
    </g>

    <!-- 未知向量 [q̈; f_c] -->
    <path d="M 134 180 L 124 180 L 124 242 L 134 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <path d="M 156 180 L 166 180 L 166 242 L 156 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <g font-family="ui-serif, Georgia, serif" font-size="14" font-weight="800" text-anchor="middle" fill="#b91c1c">
      <text x="145" y="204">q̈</text>
      <text x="145" y="232">f_c</text>
    </g>

    <text x="180" y="217" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">=</text>

    <!-- 右端向量 -->
    <path d="M 202 180 L 192 180 L 192 242 L 202 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <path d="M 298 180 L 308 180 L 308 242 L 298 242" fill="none" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
    <g font-family="ui-serif, Georgia, serif" font-size="12" font-weight="700" text-anchor="middle">
      <text x="250" y="204" fill="#c2410c">Sᵀτ+f_ext−Cq̇−g</text>
      <text x="250" y="232" fill="#16a34a">−J̇_c q̇</text>
    </g>

    <text x="168" y="258" text-anchor="middle" font-size="10.5" fill="#64748b">法向受压 Fy ≥ 0 · 静摩擦锥校验 · Fy=0 离地</text>

    <!-- 腾空相框 -->
    <rect x="16" y="280" width="304" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="168" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">腾空相无约束 ODE（f_c = 0，式 23）</text>
    <text x="168" y="317" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" font-family="ui-serif, Georgia, serif">q̈ = M⁻¹(Sᵀ τ + f_ext − C q̇ − g)</text>

    <rect x="16" y="338" width="304" height="24" rx="6" fill="#ede9fe"/>
    <text x="168" y="354" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">输出 M, C, g ➜ 控制 · (q̈, f_c) ➜ 积分</text>
  </g>

  <!-- ======================== 阶段 4：多任务控制逆解（右上，蓝） ======================== -->
  <g transform="translate(780, 72)">
    <rect width="316" height="176" rx="12" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="316" height="34" rx="12" fill="#f0f9ff"/>
    <rect x="0" y="22" width="316" height="12" fill="#f0f9ff"/>
    <line x1="0" y1="34" x2="316" y2="34" stroke="#bae6fd" stroke-width="1"/>
    <text x="16" y="22" font-size="13.5" font-weight="800" fill="#0c4a6e">阶段 4 · 多任务控制逆解</text>

    <text x="16" y="58" font-size="12" fill="#475569">3 级零空间优先级投影 + QR 消反力反解</text>

    <rect x="16" y="72" width="284" height="54" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="158" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1" font-family="ui-serif, Georgia, serif">q̈_d = q̈₁ + N₁(q̈₂ + N₂ q̈₃)</text>
    <text x="158" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#0284c7" font-family="ui-serif, Georgia, serif">τ = (S_u Q₂)⁻¹ Q₂ᵀ (M q̈_d + C q̇ + g − f_ext)</text>

    <rect x="16" y="138" width="284" height="24" rx="6" fill="#e0f2fe"/>
    <text x="158" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c4a6e">输出期望关节力矩 τ ➜ 引擎 / 仿真</text>
  </g>

  <!-- ======================== 阶段 5：闭环仿真与硬件反解（右下，灰） ======================== -->
  <g transform="translate(780, 272)">
    <rect width="316" height="176" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="316" height="34" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="22" width="316" height="12" fill="#f1f5f9"/>
    <line x1="0" y1="34" x2="316" y2="34" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="22" font-size="13.5" font-weight="800" fill="#0f172a">阶段 5 · 闭环仿真与硬件反解</text>

    <text x="16" y="58" font-size="12" fill="#475569">ODE 连续积分推进 · 反解减速比与实机轨迹</text>

    <rect x="16" y="72" width="284" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="158" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b" font-family="ui-serif, Georgia, serif">i_gear ≤ ω_max / q̇_max ≈ 22.8 → 19.13</text>
    <text x="158" y="116" text-anchor="middle" font-size="11" fill="#475569">离散阶梯速度指令 q̇_cmd(t) → Sim-to-Real</text>

    <rect x="16" y="138" width="284" height="24" rx="6" fill="#e2e8f0"/>
    <text x="158" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">反馈状态 (q, q̇) · 硬件参数闭环</text>
  </g>

  <!-- ======================== 模块间连线 ======================== -->
  <!-- 阶段 1 ➜ 阶段 3 -->
  <line x1="340" y1="160" x2="386" y2="160" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="366" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">q, J_c</text>

  <!-- 阶段 2 ➜ 阶段 3 -->
  <line x1="340" y1="360" x2="386" y2="360" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrOrange)"/>
  <text x="366" y="350" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2410c">S, f_ext</text>

  <!-- 阶段 3 ➜ 阶段 4 (M, C, g) -->
  <line x1="728" y1="138" x2="774" y2="138" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrPurple)"/>
  <text x="754" y="128" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">M,C,g</text>

  <!-- 阶段 4 ➜ 阶段 3 (τ) -->
  <line x1="780" y1="184" x2="734" y2="184" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="754" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0369a1">τ</text>

  <!-- 阶段 3 ➜ 阶段 5 (q̈) -->
  <line x1="728" y1="336" x2="774" y2="336" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrPurple)"/>
  <text x="754" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">q̈</text>

  <!-- 阶段 5 ➜ 阶段 3 ((q, q̇) 步进反馈) -->
  <line x1="780" y1="382" x2="734" y2="382" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrSlate)"/>
  <text x="754" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">(q, q̇)</text>
</svg>
