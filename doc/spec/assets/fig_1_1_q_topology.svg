<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <pattern id="groundHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ======================== 上左：浮基开链拓扑 ======================== -->
  <rect x="16" y="16" width="600" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <g transform="translate(38, 34)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">浮基开链拓扑（机身不固连地面）</text>
    <circle cx="6" cy="22" r="4" fill="#0284c7"/>
    <text x="15" y="26" font-size="12" font-weight="600" fill="#0284c7">浮基 3-DOF</text>
    <circle cx="120" cy="22" r="4" fill="#ea580c"/>
    <text x="129" y="26" font-size="12" font-weight="600" fill="#ea580c">关节 3-DOF</text>
    <circle cx="240" cy="22" r="4" fill="#16a34a"/>
    <text x="249" y="26" font-size="12" font-weight="600" fill="#16a34a">外部接触</text>
  </g>

  <text x="38" y="78" font-size="11" fill="#64748b">杆长比例 l₁:l₂:l₃:l₄ = 120:120:23:60 mm · θ₃=45°</text>
  <text x="38" y="96" font-size="11" fill="#6d28d9">Bᵢ：+xᵢ 沿杆指向远端 · +yᵢ 由 +xᵢ 逆时针转 90°</text>

  <rect x="40" y="365" width="550" height="14" fill="url(#groundHatch)"/>
  <line x1="40" y1="365" x2="590" y2="365" stroke="#475569" stroke-width="2"/>

  <!-- 世界系 O-XY -->
  <g transform="translate(75, 365)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#arrSlate)"/>
    <line x1="0" y1="0" x2="0" y2="-52" stroke="#0f172a" stroke-width="2" marker-end="url(#arrSlate)"/>
    <circle cx="0" cy="0" r="3" fill="#0f172a"/>
    <text x="-16" y="13" font-size="12" font-weight="700" fill="#0f172a">O</text>
    <text x="54" y="4" font-size="12" font-weight="700" fill="#0f172a">+X 前</text>
    <text x="-8" y="-58" font-size="12" font-weight="700" fill="#0f172a">+Y 上</text>
  </g>

  <!-- 本体系 O_B：+x_B 朝头，+y_B 由 +x_B 逆时针转 90° -->
  <g transform="translate(355, 170) rotate(-25)">
    <line x1="0" y1="0" x2="48" y2="0" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
    <text x="52" y="5" font-size="12" font-weight="700" fill="#0284c7">+x_B 朝头</text>
    <text x="4" y="-56" font-size="12" font-weight="700" fill="#0284c7">+y_B</text>
  </g>

  <!-- 连杆系 B1–B4：原点在近端铰点；+x 沿杆指向远端；+y 由 +x 逆时针转 90° -->
  <g fill="none" stroke="#6d28d9" stroke-width="1.7" stroke-linecap="round">
    <!-- B1 @ J1 -->
    <line x1="355" y1="170" x2="331.4" y2="178.6" marker-end="url(#arrViolet)"/>
    <line x1="355" y1="170" x2="363.6" y2="193.6" marker-end="url(#arrViolet)"/>
    <!-- B2 @ J2 -->
    <line x1="231.6" y1="214.9" x2="229.2" y2="242.8" marker-end="url(#arrViolet)"/>
    <line x1="231.6" y1="214.9" x2="259.5" y2="217.3" marker-end="url(#arrViolet)"/>
    <!-- B3 @ J3（杆短，轴缩短） -->
    <line x1="220.2" y1="345.7" x2="231.8" y2="359.5" marker-end="url(#arrViolet)"/>
    <line x1="220.2" y1="345.7" x2="234.0" y2="334.1" marker-end="url(#arrViolet)"/>
    <!-- B4 @ J4：两轴同一原点，略抬离足掌以便看见 -->
    <line x1="236.3" y1="358" x2="268" y2="358" marker-end="url(#arrViolet)"/>
    <line x1="236.3" y1="358" x2="236.3" y2="332" marker-end="url(#arrViolet)"/>
  </g>
  <g fill="#6d28d9" font-size="11" font-weight="700">
    <text x="314" y="172">+x₁</text>
    <text x="368" y="208">+y₁</text>
    <text x="208" y="246">+x₂</text>
    <text x="262" y="212">+y₂</text>
    <text x="250" y="390">+x₃</text>
    <text x="248" y="318">+y₃</text>
    <text x="286" y="350">+x₄</text>
    <text x="242" y="340">+y₄</text>
  </g>

  <!-- q1 q2 -->
  <line x1="75" y1="409" x2="352" y2="409" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="205" y="403" font-size="14" font-weight="700" fill="#0284c7">q₁</text>
  <line x1="355" y1="409" x2="355" y2="365" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="355" y1="365" x2="355" y2="178" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="365" y="270" font-size="14" font-weight="700" fill="#0284c7">q₂</text>

  <!-- 机身 -->
  <g transform="translate(355, 170)">
    <line x1="0" y1="0" x2="135" y2="0" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4"/>
    <g transform="rotate(-25)">
      <line x1="-175" y1="0" x2="155" y2="0" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4"/>
      <path d="M -145,-7 L 95,-11 C 115,-11 128,-5 128,0 C 128,5 115,11 95,11 L -145,7 C -155,7 -158,3 -158,0 C -158,-3 -155,-7 -145,-7 Z" fill="#334155" opacity="0.88"/>
      <path d="M -155,-4 L -180,-22 L -162,-22 L -138,-6 Z" fill="#64748b"/>
      <line x1="134" y1="-28" x2="134" y2="28" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="131" cy="0" r="3.5" fill="#0f172a"/>
    </g>
  </g>

  <line x1="231.61" y1="214.91" x2="194.04" y2="228.59" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="220.16" y1="345.72" x2="216.68" y2="385.54" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="236.34" y1="365" x2="265.26" y2="399.46" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3"/>

  <line x1="355" y1="170" x2="231.61" y2="214.91" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round"/>
  <text x="292" y="198" font-size="13" font-weight="700" fill="#1e293b">l₁</text>
  <line x1="231.61" y1="214.91" x2="220.16" y2="345.72" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <text x="238" y="280" font-size="13" font-weight="700" fill="#1e293b">l₂</text>
  <line x1="220.16" y1="345.72" x2="236.34" y2="365" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <text x="256" y="312" font-size="12" font-weight="700" fill="#475569">l₃</text>
  <line x1="236.34" y1="365" x2="302" y2="365" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <text x="328" y="380" font-size="13" font-weight="700" fill="#1e293b">l₄</text>

  <path d="M 437 170 A 82,82 0 0,0 429.3,135.3" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="447" y="153" font-size="14" font-weight="700" fill="#0284c7">q₃</text>
  <path d="M 389.4 153.9 A 38,38 0 0,0 319.3,183" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="327" y="125" font-size="14" font-weight="700" fill="#ea580c">q₄</text>
  <path d="M 195.9 227.9 A 38,38 0 0,0 228.3,252.8" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="188" y="258" font-size="14" font-weight="700" fill="#ea580c">q₅</text>
  <path d="M 218.3 367.6 A 22,22 0 0,0 234.3,362.6" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrSlate)"/>
  <text x="176" y="386" font-size="12" font-weight="700" fill="#64748b">θ₃</text>
  <path d="M 258.2 391 A 34,34 0 0,0 270.3,365" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="276" y="396" font-size="14" font-weight="700" fill="#ea580c">q₆</text>

  <circle cx="355" cy="170" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="392" y="184" font-size="12" font-weight="700" fill="#0f172a">O_B ≡ J₁</text>
  <circle cx="231.61" cy="214.91" r="5.5" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="214" y="208" font-size="12" font-weight="700" fill="#0f172a">J₂</text>
  <rect x="216.16" y="341.72" width="8" height="8" rx="1.5" fill="#64748b"/>
  <text x="186" y="332" font-size="12" font-weight="700" fill="#475569">J₃</text>
  <circle cx="236.34" cy="365" r="5.5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="142" y="352" font-size="12" font-weight="700" fill="#16a34a">J₄ (p_toe)</text>
  <circle cx="302" cy="365" r="5.5" fill="#16a34a"/>
  <text x="312" y="361" font-size="12" font-weight="700" fill="#16a34a">p_tip</text>
  <line x1="236.34" y1="397" x2="236.34" y2="374" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrGreen)"/>
  <line x1="302" y1="397" x2="302" y2="374" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrGreen)"/>
  <text x="312" y="395" font-size="12" font-weight="700" fill="#16a34a">f_c</text>

  <!-- ======================== 上右：广义坐标列向量（重点放大） ======================== -->
  <rect x="632" y="16" width="292" height="420" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="648" y="46" font-size="17" font-weight="800" fill="#0c4a6e">广义坐标 q（整机构型）</text>
  <text x="648" y="68" font-size="11" fill="#0369a1">浮基位姿 3 + 开链关节 3 = 6-DOF · 逆时针为正</text>

  <!-- q = 垂直居中 -->
  <text x="650" y="248" font-size="36" font-family="ui-serif, Georgia, serif" font-style="italic" font-weight="700" fill="#0f172a">q</text>
  <text x="684" y="248" font-size="30" fill="#0f172a">=</text>

  <!-- 分类括号 -->
  <path d="M 724 96 L 712 96 L 712 230 L 724 230" fill="none" stroke="#0284c7" stroke-width="2.6"/>
  <text x="674" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#0284c7">浮基位姿</text>
  <text x="674" y="173" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">3-DOF · 世界系</text>
  <path d="M 724 250 L 712 250 L 712 384 L 724 384" fill="none" stroke="#ea580c" stroke-width="2.6"/>
  <text x="674" y="310" text-anchor="middle" font-size="12" font-weight="800" fill="#ea580c">开链关节</text>
  <text x="674" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#c2410c">3-DOF · 相对角</text>

  <!-- 列向量括号 -->
  <path d="M 752 88 L 732 88 L 732 392 L 752 392" fill="none" stroke="#0f172a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 888 88 L 908 88 L 908 392 L 888 392" fill="none" stroke="#0f172a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- qi + 释义（括号内） -->
  <g font-family="ui-serif, Georgia, serif" font-size="24" font-weight="800">
    <text x="760" y="126" fill="#0284c7">q₁</text>
    <text x="760" y="174" fill="#0284c7">q₂</text>
    <text x="760" y="222" fill="#0284c7">q₃</text>
    <text x="760" y="286" fill="#ea580c">q₄</text>
    <text x="760" y="334" fill="#ea580c">q₅</text>
    <text x="760" y="382" fill="#ea580c">q₆</text>
  </g>
  <g font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="800" y="118" fill="#0284c7" font-weight="700">x_hip</text>
    <text x="800" y="132" fill="#64748b">O_B 的 +X</text>
    <text x="800" y="166" fill="#0284c7" font-weight="700">y_hip</text>
    <text x="800" y="180" fill="#64748b">O_B 的 +Y</text>
    <text x="800" y="214" fill="#0284c7" font-weight="700">θ_body</text>
    <text x="800" y="228" fill="#64748b">∠(+X, +x_B)</text>
    <text x="800" y="278" fill="#ea580c" font-weight="700">q_hip</text>
    <text x="800" y="292" fill="#64748b">∠(+x_B, l₁)</text>
    <text x="800" y="326" fill="#ea580c" font-weight="700">q_ankle</text>
    <text x="800" y="340" fill="#64748b">∠(l₁, l₂)</text>
    <text x="800" y="374" fill="#ea580c" font-weight="700">q_toe</text>
    <text x="800" y="388" fill="#64748b">∠(l₃, l₄)</text>
  </g>

  <text x="648" y="418" font-size="10.5" fill="#64748b">配合左图拓扑与轴系唯一确定构型 · θ₃常值∉q · O_B≡J₁</text>
</svg>
