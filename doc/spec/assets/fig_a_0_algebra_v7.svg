<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 248" width="100%" height="auto" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <defs>
    <filter id="cardShadowA04" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.06"/>
    </filter>
    <marker id="arrGreenA04" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrOrangeA04" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <g transform="translate(12, 8)">
    <rect width="676" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadowA04)"/>

    <!-- 顶部标题条 -->
    <rect x="0" y="0" width="676" height="30" rx="12" fill="#f1f5f9"/>
    <rect x="0" y="18" width="676" height="12" fill="#f1f5f9"/>
    <line x1="0" y1="30" x2="676" y2="30" stroke="#e2e8f0" stroke-width="1"/>
    <text x="338" y="20" text-anchor="middle" font-size="12.2" font-weight="800" fill="#1e293b">图 A.1 · 链式法则与第 1、5 列偏导展开</text>

    <g transform="translate(0, 26)">
    <!-- ======================== 上半区：链式法则与雅可比矩阵 ======================== -->
    <rect x="14" y="14" width="648" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- ṗ_tip = Σ (∂p_tip/∂qⱼ) q̇ⱼ = -->
    <text x="28" y="62" font-size="14" font-weight="800" fill="#0f172a">ṗ_tip</text>
    <text x="72" y="62" font-size="14" font-weight="700" fill="#334155">=</text>

    <text x="98" y="64" text-anchor="middle" font-size="19" font-weight="600" fill="#334155">Σ</text>
    <text x="98" y="43" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">6</text>
    <text x="98" y="77" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b">j=1</text>

    <text x="136" y="51" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">∂p_tip</text>
    <line x1="116" y1="57" x2="156" y2="57" stroke="#334155" stroke-width="1.3"/>
    <text x="136" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">∂qⱼ</text>

    <text x="162" y="62" font-size="13.5" font-weight="700" fill="#0f172a">q̇ⱼ</text>
    <text x="186" y="62" font-size="14" font-weight="700" fill="#334155">=</text>

    <!-- 矩阵左括号 [ -->
    <path d="M 214 31 L 207 31 L 207 83 L 214 83" fill="none" stroke="#334155" stroke-width="1.8"/>

    <!-- 第 1 列：偏导形式（橙色高亮） -->
    <rect x="218" y="34" width="58" height="46" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <text x="247" y="51" text-anchor="middle" font-size="11" font-weight="800" fill="#ea580c">∂p_tip</text>
    <line x1="228" y1="57" x2="266" y2="57" stroke="#ea580c" stroke-width="1.3"/>
    <text x="247" y="71" text-anchor="middle" font-size="11" font-weight="800" fill="#ea580c">∂q₁</text>

    <!-- 第 2 列：偏导形式（浅灰） -->
    <text x="302" y="51" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">∂p_tip</text>
    <line x1="284" y1="57" x2="320" y2="57" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="302" y="71" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">∂q₂</text>

    <!-- 省略号 -->
    <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">⋯</text>

    <!-- 第 5 列高亮框（绿） -->
    <rect x="358" y="34" width="58" height="46" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <text x="387" y="51" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">∂p_tip</text>
    <line x1="368" y1="57" x2="406" y2="57" stroke="#16a34a" stroke-width="1.3"/>
    <text x="387" y="71" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">∂q₅</text>

    <!-- 第 6 列（浅灰） -->
    <text x="448" y="51" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">∂p_tip</text>
    <line x1="430" y1="57" x2="466" y2="57" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="448" y="71" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">∂q₆</text>

    <!-- 矩阵右括号 ] -->
    <path d="M 472 31 L 479 31 L 479 83 L 472 83" fill="none" stroke="#334155" stroke-width="1.8"/>

    <!-- 广义速度分量列（带省略） -->
    <path d="M 498 24 L 491 24 L 491 100 L 498 100" fill="none" stroke="#334155" stroke-width="1.8"/>
    <text x="518" y="40" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">q̇₁</text>
    <text x="518" y="56" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">q̇₂</text>
    <text x="518" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">⋮</text>
    <text x="518" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">q̇₆</text>
    <path d="M 538 24 L 545 24 L 545 100 L 538 100" fill="none" stroke="#334155" stroke-width="1.8"/>

    <!-- ======================== 第 1 列小插图：偏导结果 [1, 0]ᵀ ======================== -->
    <rect x="36" y="118" width="88" height="72" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <text x="80" y="136" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">偏导结果</text>
    <path d="M 58 144 L 52 144 L 52 180 L 58 180" fill="none" stroke="#ea580c" stroke-width="1.6"/>
    <text x="80" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#ea580c">1</text>
    <text x="80" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#ea580c">0</text>
    <path d="M 102 144 L 108 144 L 108 180 L 102 180" fill="none" stroke="#ea580c" stroke-width="1.6"/>
    <line x1="118" y1="130" x2="236" y2="82" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrOrangeA04)"/>

    <!-- ======================== 第 5 列垂直引出箭头 ======================== -->
    <line x1="387" y1="80" x2="387" y2="124" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreenA04)"/>

    <!-- ======================== 下半区：第 5 列纯展开向量 = R(90°) · r₅ ======================== -->
    <rect x="190" y="130" width="400" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>

    <path d="M 210 138 L 204 138 L 204 176 L 210 176" fill="none" stroke="#16a34a" stroke-width="1.7"/>
    <text x="328" y="153" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">−(l₂ sin α₂ + l₃ sin α₃ + l₄ sin α₄)</text>
    <text x="328" y="172" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">l₂ cos α₂ + l₃ cos α₃ + l₄ cos α₄</text>
    <path d="M 446 138 L 452 138 L 452 176 L 446 176" fill="none" stroke="#16a34a" stroke-width="1.7"/>

    <text x="470" y="162" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">=</text>
    <text x="486" y="162" font-size="13.5" font-weight="800" fill="#16a34a">R(90°) · <tspan fill="#0284c7">r₅</tspan></text>
    </g>
  </g>
</svg>
